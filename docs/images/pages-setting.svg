<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d">
  <title id="t">Where to switch on GitHub Pages</title>
  <desc id="d">In the repository, open Settings, then Pages, and set Source to GitHub Actions.</desc>
  <style>
    text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
    .b{fill:#ece9e4;font-size:18px;font-weight:700} .t{fill:#ece9e4;font-size:15px} .s{fill:#98938b;font-size:13.5px} .a{fill:#3d82f6;font-size:14.5px;font-weight:700}
  </style>
  <rect x="1" y="1" width="758" height="328" rx="18" fill="#171716" stroke="#32302d"/>
  <text x="32" y="42" class="s">Your repository</text>
  <text x="140" y="42" class="s">›</text><text x="156" y="42" class="t">Settings</text>
  <text x="222" y="42" class="s">›</text><text x="238" y="42" class="t" font-weight="700">Pages</text>
  <rect x="32" y="66" width="696" height="206" rx="14" fill="#1f1e1d" stroke="#32302d"/>
  <text x="56" y="102" class="b">Build and deployment</text>
  <text x="56" y="142" class="s">Source</text>
  <rect x="56" y="152" width="300" height="46" rx="10" fill="#171716" stroke="#3d82f6" stroke-width="2.4"/>
  <text x="76" y="181" class="t" font-weight="700">GitHub Actions</text>
  <path d="M326 170l7 7 7-7" fill="none" stroke="#98938b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M392 175H372" stroke="#3d82f6" stroke-width="2.4" stroke-linecap="round"/><path d="M379 168l-8 7 8 7" fill="none" stroke="#3d82f6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="404" y="170" class="a">Choose this once.</text>
  <text x="404" y="190" class="s">Not "Deploy from a branch".</text>
  <text x="56" y="242" class="s">The workflow in .github/workflows/deploy.yml does the publishing from then on.</text>
  <text x="380" y="308" text-anchor="middle" class="s">Illustration. GitHub's own screen may look slightly different.</text>
</svg>
