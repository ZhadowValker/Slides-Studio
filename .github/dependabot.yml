version: 2
updates:
  # Keep the GitHub Actions used by the workflows up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Keep the test tooling up to date.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Pinned on purpose: tests must use the same PptxGenJS version that index.html loads from the CDN.
      - dependency-name: pptxgenjs
